<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>headroid explainer</title>
<style>
  :root {
    --bg: #f3ebdd; --bg2: #ebe0cc; --ink: #2b2219; --muted: #7b6a55;
    --accent: #1f8a5c; --accent2: #b8612a; --bad: #c0392b; --warn: #d99a2b;
    --card: #fffaf1; --line: #ddcdb3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--bg); }
  body { font-family: "Segoe UI", "Inter", system-ui, sans-serif; color: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: radial-gradient(1200px 900px at 50% -10%, #fbf6ec 0%, var(--bg) 55%, #eadfca 100%); }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .abs { position: absolute; }
  .center { left: 0; right: 0; text-align: center; }
  h1 { font-size: 78px; line-height: 1.08; font-weight: 800; letter-spacing: -1.5px; }
  h2 { font-size: 54px; line-height: 1.12; font-weight: 800; letter-spacing: -1px; }
  .lead { font-size: 34px; color: var(--muted); line-height: 1.35; }
  .tag { display: inline-block; padding: 10px 22px; border-radius: 999px; font-size: 26px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; }
  .tag.bad { background: rgba(192, 57, 43, .12); color: var(--bad); }
  .tag.good { background: rgba(31, 138, 92, .13); color: var(--accent); }
  .tag.blue { background: rgba(184, 97, 42, .13); color: var(--accent2); }

  /* phone */
  .phone { position: absolute; width: 300px; height: 610px; border-radius: 44px; background: #2b2118;
    border: 3px solid #4a3a2c; box-shadow: 0 30px 70px rgba(80, 55, 25, .28); }
  .phone .notch { position: absolute; top: 14px; left: 50%; width: 90px; height: 22px; margin-left: -45px;
    background: #2b2118; border-radius: 12px; z-index: 5; border: 2px solid #3e3024; }
  .screen { position: absolute; inset: 12px; border-radius: 34px; overflow: hidden; background: #fbf8f2; }
  .appbar { height: 92px; padding: 46px 18px 0; font-size: 20px; font-weight: 700; color: #fff; }
  .field { margin: 14px 18px 0; height: 52px; border-radius: 12px; background: #fff; border: 2px solid #e3d8c6;
    font-size: 20px; color: #2b2219; padding: 12px 14px; font-family: Consolas, monospace; overflow: hidden; white-space: nowrap; }
  .btn { margin: 18px 18px 0; height: 54px; border-radius: 12px; background: #34607e; color: #fff; font-weight: 700;
    font-size: 21px; text-align: center; line-height: 54px; }
  .tap { position: absolute; width: 46px; height: 46px; border-radius: 50%; border: 4px solid #d6457a;
    background: rgba(214, 69, 122, .22); transform: translate(-50%, -50%); z-index: 8; }
  .bubble { position: absolute; max-width: 200px; padding: 10px 14px; border-radius: 16px; font-size: 18px; line-height: 1.25; }
  .bubble.me { right: 14px; background: #bfe8cf; color: #0f3a24; border-bottom-right-radius: 4px; }
  .bubble.them { left: 14px; background: #fff; color: #2b2219; border-bottom-left-radius: 4px; border: 1px solid #e6dccb; }
  .kb { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: #e4dccd; }
  .kb i { position: absolute; width: 22px; height: 32px; background: #fff; border-radius: 5px; }

  .hidden-phone { border: 3px dashed var(--accent2); background: rgba(184, 97, 42, .06); box-shadow: 0 0 50px rgba(184, 97, 42, .22); }
  .hidden-phone .screen { opacity: .97; }
  .label { position: absolute; font-size: 26px; font-weight: 700; text-align: center; width: 340px; }

  .row { position: absolute; left: 110px; right: 90px; font-size: 36px; font-weight: 600; display: flex; align-items: center; gap: 22px; }
  .row .ic { flex: 0 0 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 900; }
  .row .ic.bad { background: rgba(192, 57, 43, .13); color: var(--bad); }
  .row .ic.good { background: rgba(31, 138, 92, .14); color: var(--accent); }

  .code { position: absolute; left: 80px; right: 80px; background: var(--card); border: 2px solid var(--line); border-radius: 22px;
    padding: 30px 34px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 29px; line-height: 1.55; color: #3a2f24;
    white-space: pre; box-shadow: 0 20px 50px rgba(80, 55, 25, .12); }
  .code .k { color: #a8327a; } .code .s { color: #22774f; } .code .c { color: #9a8a73; } .code .f { color: #2c5a8c; }
  .chat { position: absolute; left: 90px; width: 640px; padding: 26px 30px; border-radius: 26px; font-size: 34px; line-height: 1.3;
    box-shadow: 0 14px 34px rgba(80, 55, 25, .10); }
  .chat.user { background: var(--card); border: 2px solid var(--line); border-bottom-left-radius: 6px; }
  .chat.agent { left: auto; right: 90px; background: #e3f2e8; border: 2px solid #bfdcc9; border-bottom-right-radius: 6px; color: #17603f; }
  .pill { position: absolute; padding: 16px 30px; border-radius: 999px; background: var(--card); border: 2px solid var(--accent2);
    font-family: Consolas, monospace; font-size: 30px; color: #3a2f24; }
  .step { position: absolute; left: 470px; font-size: 30px; font-weight: 600; color: var(--muted); }
  .step b { color: var(--accent); }
  .logo { font-size: 120px; font-weight: 900; letter-spacing: -3px; }
  .logo span { color: var(--accent); }
  .ghost { color: var(--accent2); }
  .progress { position: absolute; left: 0; bottom: 0; height: 8px; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
  .watermark { position: absolute; right: 36px; bottom: 26px; font-size: 22px; color: #a8957a; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body><div id="stage">
  <div class="abs center" style="top:70px"><span class="tag good">Open source · Alpha</span></div>
  <h1 class="abs center" style="top:150px; font-size:84px">Test Android apps.<br>Keep using your phone.</h1>
  
    <div class="label" style="left:90px; top:380px; color:var(--ink)">Your screen</div>
    <div class="label ghost" style="left:650px; top:380px">Hidden screen</div>
    <div class="phone" style="left:110px; top:430px">
      <div class="notch"></div>
      <div class="screen" style="background:#eaf6f0">
        <div class="appbar" style="background:#128c5a">Chat</div>
        <div class="bubble them" style="top:116px">Lunch at 1?</div>
        <div class="bubble me" style="top:176px">Sure, see you there!</div>
        <div class="kb" id="kb"></div>
      </div>
    </div>
    <div class="phone hidden-phone" style="left:670px; top:430px">
      <div class="screen">
        <div class="appbar" style="background:#34607e">Your app (under test)</div>
        <div class="field">demo@headroid.dev</div>
        <div class="field">••••••••</div>
        <div class="btn">Sign in</div>
        <div class="abs" style="left:0;right:0;top:380px;text-align:center;font-size:24px;font-weight:800;color:#0a8f57">✓ Signed in</div>
      </div>
      <div class="tap" style="left:228px; top:300px; opacity:1"></div>
    </div>
  <div class="abs" style="left:420px; top:720px; width:240px; height:4px; background:repeating-linear-gradient(90deg,var(--accent2) 0 14px,transparent 14px 26px)"></div>
  <p class="abs center lead" style="top:1085px; font-size:34px">Tests run on a <b style="color:var(--accent2)">hidden screen</b>.</p>
  <div class="abs center" style="top:1150px"><span class="logo" style="font-size:96px">head<span>roid</span></span></div>
</div><script>(function(){const kb=document.getElementById("kb");const rows=[10,9,7];let h="";rows.forEach((n,r)=>{const w=22,g=4.6,l=(276-n*w-(n-1)*g)/2;for(let i=0;i<n;i++)h+=`<i style="left:${l+i*(w+g)}px;top:${14+r*42}px"></i>`});h+=`<i style="left:60px;top:140px;width:156px;height:24px"></i>`;kb.innerHTML=h;window.render=()=>{};window.DURATION=1;})();</script></body></html>
