name: release

# Builds the installable wheel (device-server jar bundled inside) on every push to main and on tags.
# A v* tag attaches the wheel and the jar to the GitHub release, so users can `pip install <wheel url>`.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "device-server/**"
      - "packages/headroid/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # the default list includes the removed "tools" package, which fails on current runners
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build server jar
        working-directory: device-server
        run: ./gradlew --no-configuration-cache :server:headroidJar :server:testDebugUnitTest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test host package
        working-directory: packages/headroid
        run: |
          pip install -e ".[dev]" build
          python -m ruff check
          python -m pytest -q
      - name: Build wheel with the jar inside
        working-directory: packages/headroid
        run: |
          python scripts/build_wheel.py --outdir dist
          python - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "headroid/_server/headroid-server.jar" in names, names
          print(whl, "contains the server jar")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: headroid-wheel
          path: packages/headroid/dist/*.whl
          if-no-files-found: error
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/headroid
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != pyproject version $version"; exit 1; }
      - name: Check package metadata
        working-directory: packages/headroid
        run: |
          pip install twine
          python -m twine check --strict dist/*.whl
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            packages/headroid/dist/*.whl
            device-server/server/build/headroid/headroid-server.jar

  # Publishes the wheel to PyPI with Trusted Publishing (no API token): pypi.org trusts this repository, this workflow
  # file and the "pypi" environment. Only the wheel is published: an sdist could not carry the prebuilt server jar.
  pypi:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/headroid/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: headroid-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
