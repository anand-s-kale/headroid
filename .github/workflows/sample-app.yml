name: sample-app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "sample-app/**"
      - ".github/workflows/sample-app.yml"
  pull_request:
    paths:
      - "sample-app/**"
      - ".github/workflows/sample-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sample-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            sample-app/**/*.gradle.kts
            sample-app/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
        with:
          # the default list includes the removed "tools" package, which fails on current runners
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: headroid-sample-debug
          path: sample-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: headroid-sample-lint-report
          path: sample-app/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sample-app/app/build/outputs/apk/debug/app-debug.apk
