name: device-server

on:
  push:
    paths:
      - "device-server/**"
      - ".github/workflows/device-server.yml"
  pull_request:
    paths:
      - "device-server/**"
      - ".github/workflows/device-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # the default list includes the removed "tools" package, which fails on current runners
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit-test
        run: ./gradlew --no-configuration-cache :server:headroidJar :server:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: headroid-server
          path: device-server/server/build/headroid/headroid-server.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-server-test-results
          path: device-server/server/build/reports/tests/
          if-no-files-found: ignore
