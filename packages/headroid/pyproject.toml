[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "headroid"
version = "0.1.0"
description = "Run Android apps on hidden virtual displays and drive them from Python."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Anand S Kale and the headroid contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
headroid = "headroid.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/headroid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
